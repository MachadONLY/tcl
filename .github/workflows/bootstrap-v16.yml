name: Install offline onboarding v16

on:
  push:
    branches: [fix/offline-club-switch-v16]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct reviewed source payload
        run: |
          test -f bootstrap/offline-v16/chunk-000
          cat bootstrap/offline-v16/chunk-* | base64 --decode > /tmp/offline-v16.tar.gz
          tar -xzf /tmp/offline-v16.tar.gz -C .
          rm -rf bootstrap/offline-v16
          rm -f .github/workflows/bootstrap-v16.yml
      - name: Commit architecture rebuild
        run: |
          git config user.name "touchline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: install deterministic offline onboarding"
          git push origin HEAD:${GITHUB_REF_NAME}
