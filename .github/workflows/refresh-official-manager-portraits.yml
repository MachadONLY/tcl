name: Refresh official manager portraits

on:
  push:
    branches: [fix/club-selector-reference-v17]
    paths:
      - "scripts/refresh-official-manager-portraits.mjs"
      - ".github/workflows/refresh-official-manager-portraits.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install WebP encoder
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Download and optimize current official portraits
        run: node scripts/refresh-official-manager-portraits.mjs
      - name: Validate offline pack and selector
        run: |
          npm ci
          npm run ensure:onboarding-assets
      - name: Commit optimized portraits
        run: |
          git config user.name "touchline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/clubs/2026-27
          git diff --cached --quiet && exit 0
          git commit -m "media: use current official 2026-27 manager portraits"
          git push origin HEAD:${GITHUB_REF_NAME}
