name: Patch Onboarding Core Offline

on:
  push:
    branches:
      - fix/onboarding-club-media-v13
    paths:
      - ".github/workflows/patch-onboarding-core-offline.yml"

permissions:
  contents: write

jobs:
  patch-core:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/onboarding-club-media-v13
          fetch-depth: 0

      - name: Remove legacy asynchronous media overwrite
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/career-onboarding.js")
          source = path.read_text(encoding="utf-8")

          old_crest = '''function crestUrl(club) {
            return `https://crests.football-data.org/${club.crestId}.png`;
          }'''
          new_crest = '''function crestUrl(club) {
            return `/assets/clubs/2026-27/${String(club.code || "").toLowerCase()}/crest.png`;
          }'''

          if old_crest not in source:
              raise SystemExit("crestUrl signature changed; refusing an unsafe patch")

          source = source.replace(old_crest, new_crest, 1)
          call = "  enrichSelectedClub();\n"
          if source.count(call) != 2:
              raise SystemExit(f"expected two legacy enrich calls, found {source.count(call)}")
          source = source.replace(call, "")

          path.write_text(source, encoding="utf-8")
          PY

          node --check src/career-onboarding.js

      - name: Commit stable offline core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/career-onboarding.js
          git commit -m "fix: stop legacy onboarding media from overwriting local tiles"
          git push origin HEAD:fix/onboarding-club-media-v13
