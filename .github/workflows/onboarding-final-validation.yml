name: Onboarding Final Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/career-onboarding*"
      - "scripts/sync-onboarding*"
      - "tests/onboarding-final*"
      - "index.html"
      - "package.json"
      - ".github/workflows/onboarding-final-validation.yml"

jobs:
  validate-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project
        run: npm ci

      - name: Install Chromium validation runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build and verify the complete offline media pack
        run: npm run sync:onboarding-assets:force

      - name: Production build
        run: npm run build

      - name: Start local game server
        run: |
          npx vite --host 127.0.0.1 > /tmp/touchline-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/touchline-vite.log
          exit 1

      - name: Review every Premier League club in Chromium
        run: node tests/onboarding-final-visual.mjs

      - name: Upload twenty-club visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-final-club-screenshots
          path: artifacts/onboarding-final
          if-no-files-found: warn
          retention-days: 7

      - name: Upload generated validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-final-media-report
          path: public/assets/clubs/2026-27/validation-report.json
          if-no-files-found: warn
          retention-days: 7
